services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: skydocker_db
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_SUPERUSER}
      POSTGRES_PASSWORD: ${DATABASE_SUPASSWORD}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_UPASSWORD: ${DATABASE_UPASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./init_db:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    build:
      context: .
      dockerfile: Dockerfile.redis
      args:
        REDIS_SUPASSWORD: ${REDIS_SUPASSWORD}
        REDIS_USER: ${REDIS_USER}
        REDIS_UPASSWORD: ${REDIS_UPASSWORD}
    container_name: skydocker_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/bitnami/redis/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli", "-a", "${REDIS_UPASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.skydocker
    container_name: skydocker_app
    restart: on-failure
    environment:
      UVICORN_HOST: ${UVICORN_HOST}
      UVICORN_PORT: ${UVICORN_PORT}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      OTP_CODE: ${OTP_CODE}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS}
      RESET_TOKEN_EXPIRE_MINUTES: ${RESET_TOKEN_EXPIRE_MINUTES}
      VERIFY_TOKEN_EXPIRE_MINUTES: ${VERIFY_TOKEN_EXPIRE_MINUTES}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl", "--fail", "http://${UVICORN_HOST}:${UVICORN_PORT}/health"]
      interval: 1h
      start_period: 5s
      start_interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./.local_mount:/app/.local_mount:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy

volumes:
  pgdata:
  redis_data: