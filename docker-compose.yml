services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: skydocker_db
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_SUPERUSER}
      POSTGRES_PASSWORD: ${DATABASE_SUPASSWORD}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_UPASSWORD: ${DATABASE_UPASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./init_db:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.skydocker
    container_name: skydocker_app
    restart: on-failure
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  test:
    build: .
    command: uv run --group dev pytest -v --capture=tee-sys
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./.local_mount:/app/.local_mount:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: