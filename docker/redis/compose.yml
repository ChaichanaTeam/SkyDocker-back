services:
  redis:
    build:
      context: .
      args:
        REDIS_SUPASSWORD: ${REDIS_SUPASSWORD}
        REDIS_USER: ${REDIS_USER}
        REDIS_UPASSWORD: ${REDIS_UPASSWORD}
    deploy:
      resources:
        limits:
          memory: 2.5G
    container_name: skydocker_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/bitnami/redis/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_UPASSWORD} ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
