services:
  db:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  storage:
    ports:
      - "127.0.0.1:8333:8333"

  app:
    command:
      - uvicorn
      - backend_src.main:app
      - --reload
      - --log-config
      - ./backend_src/logging.json
    volumes:
      - ./backend_src:/app/backend_src
